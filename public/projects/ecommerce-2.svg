<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ecomBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18072E" />
      <stop offset="100%" stop-color="#120426" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#ecomBg2)" />

  <text x="400" y="50" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">Auditoría Heurística: Antes vs. Después</text>
  <text x="400" y="75" fill="#C6B39A" font-family="sans-serif" font-size="12" text-anchor="middle">Evaluación de las 10 Heurísticas de Nielsen aplicadas al flujo de conversión</text>

  <!-- Left Card: Antes (Fricción) -->
  <g transform="translate(60, 110)">
    <rect width="320" height="330" rx="16" fill="#1C0A25" stroke="#EF4444" stroke-opacity="0.5" stroke-width="1.5" />
    <rect x="20" y="20" width="100" height="24" rx="12" fill="#EF4444" fill-opacity="0.2" />
    <text x="70" y="36" fill="#EF4444" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">✕ ANTES (7 pasos)</text>

    <!-- Friction items -->
    <g transform="translate(20, 65)">
      <text x="0" y="15" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Puntos Críticos de Abandono:</text>
      
      <rect y="30" width="280" height="42" rx="8" fill="#2B0E1E" />
      <text x="12" y="55" fill="#F87171" font-family="sans-serif" font-size="11">• Registro obligatorio antes de comprar</text>

      <rect y="82" width="280" height="42" rx="8" fill="#2B0E1E" />
      <text x="12" y="107" fill="#F87171" font-family="sans-serif" font-size="11">• Costos de envío ocultos hasta el final</text>

      <rect y="134" width="280" height="42" rx="8" fill="#2B0E1E" />
      <text x="12" y="159" fill="#F87171" font-family="sans-serif" font-size="11">• Formularios redundantes (14 campos)</text>

      <!-- Friction Stat -->
      <text x="0" y="215" fill="#EF4444" font-family="sans-serif" font-size="28" font-weight="800">58%</text>
      <text x="70" y="208" fill="#ffffff" opacity="0.8" font-family="sans-serif" font-size="11" font-weight="600">Tasa de rebote</text>
      <text x="70" y="222" fill="#F87171" font-family="sans-serif" font-size="10">en el paso de pago</text>
    </g>
  </g>

  <!-- Right Card: Después (Optimizado) -->
  <g transform="translate(420, 110)">
    <rect width="320" height="330" rx="16" fill="#131C2D" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.5" />
    <rect x="20" y="20" width="120" height="24" rx="12" fill="#10B981" fill-opacity="0.2" />
    <text x="80" y="36" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓ DESPUÉS (3 pasos)</text>

    <!-- Optimization items -->
    <g transform="translate(20, 65)">
      <text x="0" y="15" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Mejoras de Usabilidad:</text>
      
      <rect y="30" width="280" height="42" rx="8" fill="#0E2824" />
      <text x="12" y="55" fill="#34D399" font-family="sans-serif" font-size="11">✓ Checkout de invitado en 1 clic</text>

      <rect y="82" width="280" height="42" rx="8" fill="#0E2824" />
      <text x="12" y="107" fill="#34D399" font-family="sans-serif" font-size="11">✓ Precios transparentes y autocompletado</text>

      <rect y="134" width="280" height="42" rx="8" fill="#0E2824" />
      <text x="12" y="159" fill="#34D399" font-family="sans-serif" font-size="11">✓ Reducción a solo 5 campos esenciales</text>

      <!-- Success Stat -->
      <text x="0" y="215" fill="#10B981" font-family="sans-serif" font-size="28" font-weight="800">-35%</text>
      <text x="80" y="208" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">Fricción de compra</text>
      <text x="80" y="222" fill="#34D399" font-family="sans-serif" font-size="10">+28% tasa de conversión estimada</text>
    </g>
  </g>
</svg>
