<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18072E" />
      <stop offset="100%" stop-color="#120426" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg3)" />

  <text x="400" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle">Iteración & Wireframing de Baja a Alta Fidelidad</text>
  <text x="400" y="80" fill="#C6B39A" font-family="sans-serif" font-size="12" text-anchor="middle">Metodología de diseño centrado en el usuario (UCD) · 3 Fases Clave</text>

  <!-- Wireframe 1: Sketch / Lo-Fi -->
  <g transform="translate(60, 110)">
    <rect width="200" height="320" rx="16" fill="#1F0D36" stroke="#ffffff" stroke-opacity="0.2" stroke-dasharray="4" />
    <rect x="20" y="20" width="60" height="12" rx="4" fill="#ffffff" opacity="0.3" />
    <rect x="20" y="45" width="160" height="70" rx="8" fill="#ffffff" opacity="0.1" />
    <rect x="20" y="130" width="160" height="35" rx="6" fill="#ffffff" opacity="0.1" />
    <rect x="20" y="175" width="160" height="35" rx="6" fill="#ffffff" opacity="0.1" />
    <rect x="20" y="220" width="160" height="35" rx="6" fill="#ffffff" opacity="0.1" />
    <rect x="40" y="275" width="120" height="28" rx="14" fill="#ffffff" opacity="0.2" />
    <text x="100" y="360" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">1. Lo-Fi Wireframe</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 285 270 L 315 270" stroke="#C6B39A" stroke-width="2" stroke-dasharray="3" />
  <polygon points="315,266 323,270 315,274" fill="#C6B39A" />

  <!-- Wireframe 2: Mid-Fi -->
  <g transform="translate(330, 110)">
    <rect width="200" height="320" rx="16" fill="#240E3E" stroke="#8D3A3C" stroke-width="1.5" />
    <rect x="20" y="20" width="80" height="12" rx="4" fill="#C6B39A" opacity="0.6" />
    <rect x="20" y="45" width="160" height="70" rx="8" fill="#3B1319" stroke="#8D3A3C" stroke-width="1" />
    <rect x="20" y="130" width="160" height="35" rx="6" fill="#2E134D" />
    <rect x="20" y="175" width="160" height="35" rx="6" fill="#2E134D" />
    <rect x="20" y="220" width="160" height="35" rx="6" fill="#2E134D" />
    <rect x="40" y="275" width="120" height="28" rx="14" fill="#8D3A3C" />
    <text x="100" y="360" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">2. Mid-Fi & Flujo</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 555 270 L 585 270" stroke="#C6B39A" stroke-width="2" stroke-dasharray="3" />
  <polygon points="585,266 593,270 585,274" fill="#C6B39A" />

  <!-- Wireframe 3: Hi-Fi -->
  <g transform="translate(600, 110)">
    <rect width="200" height="320" rx="16" fill="#120426" stroke="#C6B39A" stroke-width="2" />
    <rect x="20" y="20" width="70" height="12" rx="4" fill="#C6B39A" />
    <rect x="20" y="45" width="160" height="70" rx="8" fill="#8D3A3C" />
    <text x="35" y="75" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">UI COMPONENTES</text>
    <rect x="20" y="130" width="160" height="35" rx="6" fill="#240E3E" stroke="#ffffff" stroke-opacity="0.2" />
    <rect x="20" y="175" width="160" height="35" rx="6" fill="#240E3E" stroke="#ffffff" stroke-opacity="0.2" />
    <rect x="20" y="220" width="160" height="35" rx="6" fill="#240E3E" stroke="#ffffff" stroke-opacity="0.2" />
    <rect x="40" y="275" width="120" height="28" rx="14" fill="#C6B39A" />
    <text x="100" y="360" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">3. Hi-Fi Prototipo</text>
  </g>
</svg>
