<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dsBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14052B" />
      <stop offset="50%" stop-color="#1A0735" />
      <stop offset="100%" stop-color="#120426" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#dsBg3)" />

  <text x="60" y="55" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="700">Accesibilidad & Cumplimiento WCAG 2.1 AA</text>
  <text x="60" y="80" fill="#C6B39A" font-family="sans-serif" font-size="12">Auditoría de ratios de contraste, foco por teclado y roles ARIA para inclusión total</text>

  <!-- Table Card -->
  <g transform="translate(60, 110)">
    <rect width="680" height="330" rx="16" fill="#1E0A36" stroke="#ffffff" stroke-opacity="0.1" />

    <!-- Table Header -->
    <rect width="680" height="48" rx="16" fill="#2A104A" />
    <text x="30" y="30" fill="#C6B39A" font-family="sans-serif" font-size="11" font-weight="700">COMBINACIÓN DE COLOR</text>
    <text x="260" y="30" fill="#C6B39A" font-family="sans-serif" font-size="11" font-weight="700">RATIO DE CONTRASTE</text>
    <text x="440" y="30" fill="#C6B39A" font-family="sans-serif" font-size="11" font-weight="700">ESTÁNDAR</text>
    <text x="560" y="30" fill="#C6B39A" font-family="sans-serif" font-size="11" font-weight="700">ESTADO</text>

    <!-- Row 1 -->
    <g transform="translate(0, 50)">
      <rect x="30" y="15" width="24" height="24" rx="6" fill="#ffffff" />
      <rect x="58" y="15" width="24" height="24" rx="6" fill="#1A0735" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="92" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Blanco sobre Deep Purple</text>
      <text x="260" y="32" fill="#10B981" font-family="sans-serif" font-size="14" font-weight="800">14.8:1</text>
      <text x="440" y="32" fill="#ffffff" opacity="0.8" font-family="sans-serif" font-size="11">AAA (Normal Text)</text>
      <rect x="560" y="18" width="70" height="22" rx="11" fill="#10B981" fill-opacity="0.2" />
      <text x="595" y="33" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">APROBADO</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 110)">
      <rect x="30" y="15" width="24" height="24" rx="6" fill="#C6B39A" />
      <rect x="58" y="15" width="24" height="24" rx="6" fill="#1A0735" stroke="#ffffff" stroke-opacity="0.2" />
      <text x="92" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Camel Gold sobre Deep Purple</text>
      <text x="260" y="32" fill="#10B981" font-family="sans-serif" font-size="14" font-weight="800">7.2:1</text>
      <text x="440" y="32" fill="#ffffff" opacity="0.8" font-family="sans-serif" font-size="11">AA (Normal Text)</text>
      <rect x="560" y="18" width="70" height="22" rx="11" fill="#10B981" fill-opacity="0.2" />
      <text x="595" y="33" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">APROBADO</text>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0, 170)">
      <rect x="30" y="15" width="24" height="24" rx="6" fill="#1A0735" stroke="#ffffff" stroke-opacity="0.2" />
      <rect x="58" y="15" width="24" height="24" rx="6" fill="#C6B39A" />
      <text x="92" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Deep Purple sobre Botón Camel</text>
      <text x="260" y="32" fill="#10B981" font-family="sans-serif" font-size="14" font-weight="800">7.2:1</text>
      <text x="440" y="32" fill="#ffffff" opacity="0.8" font-family="sans-serif" font-size="11">AA (UI Component)</text>
      <rect x="560" y="18" width="70" height="22" rx="11" fill="#10B981" fill-opacity="0.2" />
      <text x="595" y="33" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">APROBADO</text>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0, 230)">
      <rect x="30" y="15" width="24" height="24" rx="6" fill="#ffffff" />
      <rect x="58" y="15" width="24" height="24" rx="6" fill="#8D3A3C" />
      <text x="92" y="32" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Blanco sobre Rubine Wine</text>
      <text x="260" y="32" fill="#10B981" font-family="sans-serif" font-size="14" font-weight="800">5.4:1</text>
      <text x="440" y="32" fill="#ffffff" opacity="0.8" font-family="sans-serif" font-size="11">AA (Large / Bold)</text>
      <rect x="560" y="18" width="70" height="22" rx="11" fill="#10B981" fill-opacity="0.2" />
      <text x="595" y="33" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">APROBADO</text>
    </g>
