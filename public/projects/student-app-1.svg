<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0735" />
      <stop offset="50%" stop-color="#240D42" />
      <stop offset="100%" stop-color="#14052B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D3A3C" />
      <stop offset="100%" stop-color="#C6B39A" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg1)" />

  <!-- Ambient lights -->
  <circle cx="200" cy="150" r="140" fill="#8D3A3C" opacity="0.18" filter="blur(60px)" />
  <circle cx="650" cy="380" r="160" fill="#C6B39A" opacity="0.15" filter="blur(70px)" />

  <!-- Mobile Mockup Frame -->
  <g transform="translate(260, 30)" filter="url(#shadow1)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="280" height="440" rx="36" fill="#0D041A" stroke="#C6B39A" stroke-opacity="0.3" stroke-width="2" />
    <!-- Screen Inner -->
    <rect x="10" y="10" width="260" height="420" rx="28" fill="#18072E" />
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="95" y="18" width="90" height="18" rx="9" fill="#080210" />

    <!-- Status Bar Elements -->
    <text x="35" y="32" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">9:41</text>
    <circle cx="230" cy="27" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="238" cy="27" r="3" fill="#ffffff" opacity="0.8" />
    <rect x="244" y="24" width="12" height="7" rx="2" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8" />

    <!-- App Header -->
    <text x="30" y="70" fill="#C6B39A" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">HOLA, VALENTINA</text>
    <text x="30" y="92" fill="#ffffff" font-family="sans-serif" font-size="17" font-weight="800">Mi Bienestar Hoy</text>

    <!-- Productivity Score Card -->
    <g transform="translate(25, 110)">
      <rect width="230" height="95" rx="16" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <text x="16" y="28" fill="#C6B39A" font-family="sans-serif" font-size="11" font-weight="600">Nivel de Enfoque</text>
      <text x="16" y="60" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800">86%</text>
      <text x="16" y="78" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="600">↑ 12% vs. ayer</text>

      <!-- Mini Chart -->
      <path d="M 120 70 Q 140 50, 160 55 T 190 35 T 215 25" fill="none" stroke="#C6B39A" stroke-width="3" stroke-linecap="round" />
      <circle cx="215" cy="25" r="4" fill="#8D3A3C" stroke="#ffffff" stroke-width="1.5" />
    </g>

    <!-- Habits Tracker Title -->
    <text x="30" y="235" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Hábitos Diarios</text>

    <!-- Habit Item 1 -->
    <g transform="translate(25, 250)">
      <rect width="230" height="48" rx="12" fill="#240E3E" stroke="#ffffff" stroke-opacity="0.08" />
      <circle cx="26" cy="24" r="10" fill="#8D3A3C" />
      <path d="M 21 24 L 24 27 L 31 20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="46" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Lectura 25 mins</text>
      <text x="46" y="38" fill="#C6B39A" font-family="sans-serif" font-size="10" opacity="0.8">Tesis / Metodología</text>
      <rect x="180" y="16" width="38" height="18" rx="9" fill="#10B981" fill-opacity="0.2" />
      <text x="199" y="29" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">LISTO</text>
    </g>

    <!-- Habit Item 2 -->
    <g transform="translate(25, 308)">
      <rect width="230" height="48" rx="12" fill="#240E3E" stroke="#ffffff" stroke-opacity="0.08" />
      <circle cx="26" cy="24" r="10" fill="none" stroke="#C6B39A" stroke-width="1.5" />
      <text x="46" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Pausa Activa & Agua</text>
      <text x="46" y="38" fill="#C6B39A" font-family="sans-serif" font-size="10" opacity="0.8">Descanso de pantalla</text>
      <text x="198" y="29" fill="#C6B39A" font-family="sans-serif" font-size="10" font-weight="600">1/3</text>
    </g>

    <!-- Bottom Nav Bar -->
    <g transform="translate(25, 375)">
      <rect width="230" height="40" rx="20" fill="#0F041E" stroke="#ffffff" stroke-opacity="0.08" />
      <circle cx="45" cy="20" r="4" fill="#C6B39A" />
      <circle cx="115" cy="20" r="4" fill="#ffffff" opacity="0.3" />
      <circle cx="185" cy="20" r="4" fill="#ffffff" opacity="0.3" />
    </g>
  </g>

  <!-- Left Side Annotations -->
  <g transform="translate(60, 160)">
    <rect width="150" height="60" rx="12" fill="#220D3E" fill-opacity="0.8" stroke="#8D3A3C" stroke-width="1" />
    <text x="16" y="25" fill="#C6B39A" font-family="sans-serif" font-size="10" font-weight="700">PANTALLA 1</text>
    <text x="16" y="44" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Dashboard Móvil</text>
  </g>

  <!-- Right Side Annotations -->
  <g transform="translate(580, 260)">
    <rect width="160" height="70" rx="12" fill="#220D3E" fill-opacity="0.8" stroke="#C6B39A" stroke-opacity="0.4" stroke-width="1" />
    <text x="16" y="25" fill="#8D3A3C" font-family="sans-serif" font-size="10" font-weight="700">UX RESEARCH</text>
    <text x="16" y="44" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="600">Disminución de carga</text>
    <text x="16" y="58" fill="#C6B39A" font-family="sans-serif" font-size="11">cognitiva en un 40%</text>
  </g>
</svg>
