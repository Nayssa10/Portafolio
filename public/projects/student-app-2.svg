<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14052B" />
      <stop offset="50%" stop-color="#1F0A38" />
      <stop offset="100%" stop-color="#16052F" />
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D3A3C" />
      <stop offset="100%" stop-color="#C6B39A" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)" />

  <circle cx="680" cy="120" r="160" fill="#8D3A3C" opacity="0.15" filter="blur(60px)" />
  <circle cx="150" cy="390" r="150" fill="#C6B39A" opacity="0.12" filter="blur(70px)" />

  <!-- Mobile Frame -->
  <g transform="translate(260, 30)" filter="url(#shadow2)">
    <rect x="0" y="0" width="280" height="440" rx="36" fill="#0D041A" stroke="#C6B39A" stroke-opacity="0.3" stroke-width="2" />
    <rect x="10" y="10" width="260" height="420" rx="28" fill="#18072E" />
    <rect x="95" y="18" width="90" height="18" rx="9" fill="#080210" />

    <text x="35" y="32" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600">9:41</text>
    <circle cx="230" cy="27" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="238" cy="27" r="3" fill="#ffffff" opacity="0.8" />
    <rect x="244" y="24" width="12" height="7" rx="2" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8" />

    <!-- Header -->
    <text x="140" y="70" fill="#C6B39A" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">MODO ENFOQUE</text>
    <text x="140" y="92" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle">Sesión de Estudio Profundo</text>

    <!-- Circular Timer -->
    <g transform="translate(140, 200)">
      <!-- Background track -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="#2D114F" stroke-width="10" />
      <!-- Progress track -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="url(#circleGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="471" stroke-dashoffset="130" transform="rotate(-90)" />
      
      <!-- Time Text -->
      <text x="0" y="10" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="800" text-anchor="middle">24:18</text>
      <text x="0" y="32" fill="#C6B39A" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle">Bloque 2 de 4</text>
    </g>

    <!-- Controls -->
    <g transform="translate(65, 310)">
      <!-- Pause/Play Button -->
      <rect x="0" y="0" width="150" height="46" rx="23" fill="#8D3A3C" />
      <text x="75" y="28" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Pausar Sesión</text>
    </g>

    <!-- Soundscape pill -->
    <g transform="translate(45, 375)">
      <rect width="190" height="34" rx="17" fill="#240E3E" stroke="#C6B39A" stroke-opacity="0.25" stroke-width="1" />
      <circle cx="20" cy="17" r="4" fill="#10B981" />
      <text x="35" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="500">Audio: Lluvia suave & Lo-Fi</text>
    </g>
  </g>

  <!-- Left Annotation -->
  <g transform="translate(60, 200)">
    <rect width="160" height="65" rx="12" fill="#220D3E" fill-opacity="0.8" stroke="#8D3A3C" stroke-width="1" />
    <text x="16" y="25" fill="#C6B39A" font-family="sans-serif" font-size="10" font-weight="700">PANTALLA 2</text>
    <text x="16" y="44" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Pomodoro Calmo</text>
    <text x="16" y="58" fill="#C6B39A" font-family="sans-serif" font-size="10">Feedback háptico sutil</text>
  </g>
</svg>
